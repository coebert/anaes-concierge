name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run check:deps
      - run: bun run lint:fix-order:check
      - run: bun run lint

  test:
    # Fast unit + regression suite (default `small` stress profile).
    # Runs on every push and PR — must stay under a minute.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run test

  stress-tests:
    # Large-dataset pagination stress test. Runs on pushes to `main` and can
    # be dispatched manually from the Actions tab. Catches performance
    # regressions (O(n^2) sorts, per-row fetches, memory blow-ups) that the
    # default `small` profile is too small to expose.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Run pagination stress test (large profile)
        env:
          LEAVE_STRESS_PROFILE: large
        run: bun run test:stress:large

  supply-chain:
    # Re-runs the supply-chain scan on every push / PR. Fails the build if
    # high or moderate advisories appear (matches Lovable supply-chain
    # findings vulnerable_dependencies_high / vulnerable_dependencies_medium).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check-supply-chain.mjs

  security-scan:
    # Static application security scan. Fails the build (and therefore
    # blocks the PR merge check) on any high-severity finding.
    # Uses Semgrep's curated `p/security-audit` + `p/secrets` rulesets;
    # ERROR-severity rules map to "high" and are what we gate on.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (fail on high severity)
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/typescript \
            --config p/react \
            --severity ERROR \
            --error \
            --metrics=off \
            --exclude 'src/routeTree.gen.ts' \
            --exclude 'src/integrations/supabase/types.ts' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.workspace' \
            --sarif --output=semgrep.sarif .
      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
