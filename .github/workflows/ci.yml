name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly at 06:00 UTC — runs the large-profile pagination stress test
    # so performance regressions surface within 24h, independent of PR churn.
    - cron: "0 6 * * *"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.4-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check:deps
      - run: bun run lint:fix-order:check
      - run: bun run lint

  test:
    # Fast unit + regression suite (default `small` stress profile).
    # Runs on every push and PR — must stay under a minute.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.4-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  stress-tests:
    # Large-dataset pagination stress test. Runs on pushes to `main`, on the
    # nightly schedule, and can be dispatched manually. Catches performance
    # regressions (O(n^2) sorts, per-row fetches, memory blow-ups) that the
    # default `small` profile is too small to expose.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.4-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Run pagination stress test (large profile)
        env:
          LEAVE_STRESS_PROFILE: large
        run: bun run test:stress:large

  supply-chain:
    # `bun audit` against the committed bun.lock (the tree that is actually
    # installed and deployed). Fails closed on scan/network/JSON errors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      # Never install first: the scan reads the committed lock only, and a
      # failing exit (advisories or scan error) must fail this job.
      - run: bun run check:supply-chain

  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.4-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Verify bun.lock is current (no drift from package.json)
        run: |
          cp bun.lock /tmp/bun.lock.committed
          bun install --frozen-lockfile --lockfile-only 2>/dev/null || bun install --frozen-lockfile
          git diff --exit-code -- bun.lock
          test ! -e package-lock.json
      - run: bun run typecheck
      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build

  security-scan:
    # Static application security scan. Fails the build (and therefore
    # blocks the PR merge check) on any high-severity finding.
    # Uses Semgrep's curated `p/security-audit` + `p/secrets` rulesets;
    # ERROR-severity rules map to "high" and are what we gate on.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (fail on high severity)
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/typescript \
            --config p/react \
            --severity ERROR \
            --error \
            --metrics=off \
            --exclude 'src/routeTree.gen.ts' \
            --exclude 'src/integrations/supabase/types.ts' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.workspace' \
            --sarif --output=semgrep.sarif .
      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
